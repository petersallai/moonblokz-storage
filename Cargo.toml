[package]
name = "moonblokz-storage"
version = "0.1.0"
edition = "2024"
description = "MoonBlokz no_std storage contract and backend implementations for embedded blockchain nodes."
license = "MIT"
readme = "README.md"
repository = "https://github.com/petersallai/moonblokz-storage"
keywords = ["embedded", "no-std", "blockchain", "rp2040", "storage"]
categories = ["embedded", "no-std"]

[features]
default = ["backend-memory", "schnorr", "block-size-2016"]
block-size-2016 = ["moonblokz-chain-types/block-size-2016"]
block-size-65536 = ["moonblokz-chain-types/block-size-65536"]
backend-memory = []
backend-rp2040 = []
# Crypto backend forwarding — the backend is NOT baked in here. Choose exactly
# one; it is forwarded to both chain-types and crypto (no storage src gates on
# the backend, so these are pure forwards). The features name the signature
# scheme (DEC-246); the default is `schnorr`, and a consumer selects another via
# `default-features = false` + `bls-min-sig` / `bls-min-pk`.
schnorr = ["moonblokz-chain-types/schnorr", "moonblokz-crypto/schnorr"]
bls-min-sig = ["moonblokz-chain-types/bls-min-sig", "moonblokz-crypto/bls-min-sig"]
bls-min-pk = ["moonblokz-chain-types/bls-min-pk", "moonblokz-crypto/bls-min-pk"]

[dependencies]
moonblokz-chain-types = { path = "../moonblokz-chain-types", default-features = false }
moonblokz-crypto = { path = "../moonblokz-crypto-lib", default-features = false }

[target.'cfg(target_arch = "arm")'.dependencies]
embassy-rp = { version = "0.8", features = ["unstable-pac", "critical-section-impl", "rp2040"] }


# Debug test runs build the curve code optimized (DEC-255): a BLS pairing in an
# unoptimized build is very slow. Only takes effect when this crate is the Cargo root.
[profile.dev.package.moonblokz-crypto]
opt-level = 3
[profile.dev.package.k256]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.bls12_381]
opt-level = 3
[profile.dev.package.ff]
opt-level = 3
[profile.dev.package.group]
opt-level = 3
[profile.dev.package.pairing]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.subtle]
opt-level = 3
